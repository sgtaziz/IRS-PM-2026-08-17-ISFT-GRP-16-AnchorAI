faithfulness_cases:
- id: f01
  description: Unsupported reason plus a wrong claim of missing data (seen in the live assistant)
  question: Why can't we offer M0507 a discount?
  evidence:
  - '[E1] M0507 profile: 6-month contract, 9 months as a member, 1.8 visits/week this month vs 2.1 usual, attends group classes'
  - '[E2] M0507 blocked: Discounted month (guardrail G03)'
  - '[E3] M0507 allowed offer: Free PT session by call (rule P06)'
  bad_answer: The discounted month is blocked by G03 because it needs month-to-month terms, which the data doesn't show [E2].
  good_answer: The discounted month is blocked for M0507 by guardrail G03 [E2]. M0507 is on a 6-month contract [E1]. A free PT session by call is allowed instead [E3].
  expect_bad: '''needs month-to-month terms'' is not in the evidence (unsupported); ''the data doesn''t show'' contradicts E1, which shows the contract'
- id: f02
  description: Unsupported inference about ordering (seen in the live assistant)
  question: What should we do for M0066?
  evidence:
  - '[E1] M0066 profile: month-to-month contract, 2 months as a member, 0.7 visits/week this month vs 1.9 usual, no group classes'
  - '[E2] M0066 rule P01: New and slipping members get a trainer onboarding session; proposes Free PT session by call'
  - '[E3] M0066 rule P03: Members whose class routine was disrupted get a personal check-in about alternatives; proposes Check-in message by SMS'
  - '[E4] M0066 allowed offer: Check-in message by SMS (rule P03)'
  - '[E5] M0066 allowed offer: Free PT session by call (rule P01)'
  bad_answer: Start with the check-in message by SMS to rebuild trust, then offer the PT session once they reply [E4][E5].
  good_answer: 'Two offers are allowed for M0066: a check-in message by SMS [E4] and a free PT session by call [E5].'
  expect_bad: '''Start with'', ''to rebuild trust'' and ''once they reply'' are not in the evidence; the rules give no order between the offers'
