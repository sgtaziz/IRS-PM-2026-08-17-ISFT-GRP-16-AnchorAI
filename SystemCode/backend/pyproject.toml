[project]
name = "anchorai"
version = "0.1.0"
description = "AnchorAI: explainable, budget-aware gym retention planner"
requires-python = ">=3.11,<3.13"
dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    # Data / knowledge discovery (Stream A)
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "imbalanced-learn>=0.12",
    "pyarrow>=16",
    "lightgbm>=4.3",
    "shap>=0.45",
    # Optimisation (Stream B)
    "deap>=1.4",
    "ortools>=9.10",
    # Knowledge graph + assistant (Stream C)
    "neo4j>=5.20",
    "openai>=1.40",
    "sentence-transformers>=3.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "jupyterlab>=4", "matplotlib>=3.8", "seaborn>=0.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
