# Guardrails: hard limits. They block proposals; the optimiser never sees blocked offers.

- id: G01_contact_fatigue
  kind: guardrail
  salience: 100
  description: Never contact a member more often than the 30-day contact cap (default once)
  when: ["at_contact_cap == true"]
  then: {block: all}
  source: "team policy (hard constraint max_contacts_per_member_per_30d, set in the offer catalogue settings); simulated interviews 2026-10-16 (owner, area manager, membership lead): two said 14 days, one about a month, so the stricter limit stays"

- id: G02_offer_cap
  kind: guardrail
  salience: 100
  description: At most the 90-day offer cap per member (default two offers)
  when: ["at_offer_cap == true"]
  then: {block: all}
  source: "team policy (default constraint max_offers_per_member_per_90d); simulated interviews 2026-10-16 (owner, area manager, membership lead): two said 2 offers in 3 months, one said 1"

- id: G03_discount_eligibility
  kind: guardrail
  salience: 100
  description: The discounted month is for month-to-month members only
  when: ["contract_period != 1"]
  then: {block: [discount_1m]}
  source: "offer catalogue eligibility; simulated interviews 2026-10-16 (owner, area manager, membership lead): never discount contract members"

- id: G04_low_risk_no_paid_offers
  kind: guardrail
  salience: 90
  description: Do not spend paid offers on low-risk members
  when: ["risk_band == low"]
  then: {block: [free_pt_session, class_pass, discount_1m]}
  source: "simulated interviews 2026-10-16 (owner, area manager, membership lead): don't spend on members who are staying anyway"

- id: G05_pt_eligibility
  kind: guardrail
  salience: 100
  description: A free PT session is for members without one in the last 90 days
  when: ["pt_last_90d == true"]
  then: {block: [free_pt_session]}
  source: "offer catalogue eligibility (members without PT in the last 90 days); review RULE-6 2026-10-17"
