# Playbooks: which offer, through which channel. Higher salience is preferred.

- id: P01_new_member_onboarding
  kind: playbook
  salience: 40
  description: New and slipping members get a trainer onboarding session
  when: ["new_member == true", "trend_ratio < 0.8", "phone == 1"]
  then: {propose: {offer_id: free_pt_session, channel: call}}
  source: "simulated interviews 2026-10-16 (owner, area manager, membership lead): a PT session gives a slipping new member a person to meet"

- id: P02_falling_regular_checkin
  kind: playbook
  salience: 40
  description: Falling regulars get a personal check-in to ask what changed
  when: ["falling_regular == true", "phone == 1"]
  then: {propose: {offer_id: checkin_message, channel: call}}
  source: "simulated interviews 2026-10-16 (owner, area manager, membership lead): for a fading regular a PT session feels salesy and a discount is wrong; ask what changed, by phone call (owner)"

- id: P03_disrupted_checkin
  kind: playbook
  salience: 45
  description: Members whose class routine was disrupted get a personal check-in about alternatives
  when: ["routine_disrupted == true", "phone == 1"]
  then: {propose: {offer_id: checkin_message, channel: sms}}
  source: "simulated interview 2026-10-16 (area manager): a timetable or instructor change needs a service message, not a promotion"

- id: P04_social_class_pass
  kind: playbook
  salience: 30
  description: Social members at medium or high risk get a bring-a-friend class pass
  when: ["social_member == true", "risk_band in [medium, high]", "phone == 1"]
  then: {propose: {offer_id: class_pass, channel: sms}}
  source: "simulated interviews 2026-10-16 (owner, area manager, membership lead): bring-a-friend works for members who joined with a friend"

- id: P05_month_to_month_discount
  kind: playbook
  salience: 25
  description: High-risk month-to-month members get a discounted month, after the other offers
  when: ["contract_period == 1", "risk_band == high", "phone == 1"]
  then: {propose: {offer_id: discount_1m, channel: call}}
  source: "simulated interviews 2026-10-16 (owner, area manager, membership lead): discounts only for month-to-month members, and as a last resort"

- id: P06_high_value_pt
  kind: playbook
  salience: 35
  description: High-value members at high risk get a personal training session
  when: ["high_value_at_risk == true", "phone == 1"]
  then: {propose: {offer_id: free_pt_session, channel: call}}
  source: team assumption

- id: P07_disengaged_checkin
  kind: playbook
  salience: 20
  description: Disengaged members get a low-cost check-in message
  when: ["disengaged == true", "risk_band in [medium, high]", "phone == 1"]
  then: {propose: {offer_id: checkin_message, channel: sms}}
  source: "simulated interviews 2026-10-16 (membership lead, owner): a personal check-in beats any offer"

- id: P08_medium_risk_checkin
  kind: playbook
  salience: 10
  description: Medium-risk members get a check-in message
  when: ["risk_band == medium", "phone == 1"]
  then: {propose: {offer_id: checkin_message, channel: sms}}
  source: "simulated interviews 2026-10-16 (owner, area manager, membership lead): email is rarely read; SMS or a messaging app is"

- id: P01b_new_member_onboarding_in_person
  kind: playbook
  salience: 40
  description: New and slipping members get a trainer onboarding session (in person, no phone on file)
  when: ["new_member == true", "trend_ratio < 0.8", "phone == 0"]
  then: {propose: {offer_id: free_pt_session, channel: in_person}}
  source: "channel fallback for members without a phone on file, same trigger as P01; review RULE-3 2026-10-17"

